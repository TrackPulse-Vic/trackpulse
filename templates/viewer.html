<!DOCTYPE html>
<html lang="en">
    <head>
        <title>View Logs - TrackPulse</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/viewer.css') }}">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="utf-8">
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='icons/logos/favicon.ico') }}">
    </head>

    <body>
        {% include 'navbar.html' %}
        <h1>View Logs</h1>
        <div class="button-list" style="padding-bottom: 10px;"><a href='/view?table=true'>View as table</a></div>
        {% for log in logs %}
            <a href="/log/{{log[0]}}">
                <div class="log-entry" style="--accent-color: {{ lineColors.get(log[2], {}).get(log[7], '#929598') }};">
                    <p>{{ log[3] }}</p>
                    <p>{{ log[8] }} to {{ log[9] }}</p>
                    <p>Line: {{ log[7] }}</p>
                    <p>Vehicle: {{ log[6] }} {{ log[5] }}</p>
                    <div class="train-image-container">
                        <img class="train-image" data-vehicle="{{ log[5] }}" src="" alt="loading photo...">
                        <div class="photo-credit" aria-hidden="true"></div>
                    </div>
                </div>
            </a>
        {% else %}
            <p>No logs available.</p>
        {% endfor %}

        <script>
        async function fetchAndSetImage(imgElement) {
            const vehicle = imgElement.getAttribute('data-vehicle');
            if (!vehicle) return;

            const container = imgElement.closest('.train-image-container');
            const creditEl = container ? container.querySelector('.photo-credit') : null;

            try {
                const response = await fetch(`http://victorianrailphotos.com/api/photos/${vehicle}?set=true`);
                const data = await response.json();

                for (const carriage of (data.carriages || [])) {
                    if (carriage.photos && carriage.photos.length > 0) {
                        const firstImage = carriage.photos[0];
                        imgElement.src = firstImage.thumbnail;
                        const photographer = firstImage.photographer;
                        imgElement.title = photographer ? `Photo by ${photographer}` : '';
                        imgElement.alt = `carriage ${carriage.carriage}`;

                        if (creditEl) {
                            if (photographer) {
                                creditEl.textContent = `© ${photographer}`;
                                creditEl.style.display = 'block';
                            } else {
                                creditEl.style.display = 'none';
                            }
                        }

                        return;
                    }
                }

                // no photos found
                if (container) container.style.display = 'none';
                else imgElement.style.display = 'none';
            } catch (error) {
                console.error(`Error fetching images for vehicle ${vehicle}:`, error);
                if (container) container.style.display = 'none';
                else imgElement.style.display = 'none';
            }
        }

        function initLazyLoad() {
            const imageElements = document.querySelectorAll('.train-image');

            if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver((entries, obs) => {
                    for (const entry of entries) {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            fetchAndSetImage(img);
                            obs.unobserve(img);
                        }
                    }
                }, {
                    root: null,
                    rootMargin: '200px',
                    threshold: 0.01
                });

                imageElements.forEach(img => observer.observe(img));
            }
        }

        document.addEventListener('DOMContentLoaded', initLazyLoad);
        </script>
    </body>
</html>
