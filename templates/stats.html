<!DOCTYPE html>
<html lang="en">
<head>
    <title>Statistics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="96x96" href="{{ url_for('static', filename='icons/logos/favicon-96x96.png') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    {% include 'navbar.html' %}
    <h1>Log Statistics</h1>
    <div class="box-div">
        <div class="chart-container">
            <canvas id="freqChart" style="width:100%; height:400px;"></canvas>
        </div>

        <table border="1">
            <tr><th>{{ stat.title() }}</th><th>Count</th></tr>
            {% for label in full_labels %}
                    <tr><td>{{ label }}</td><td>{{ full_values[loop.index0] }}</td></tr>
            {% endfor %}
        </table>

        <script>
        const labels = {{ truncated_labels | tojson }};
        const values = {{ truncated_values | tojson }};

        let data = labels.map((label, i) => ({ label, value: values[i] }));
        data.sort((a, b) => b.value - a.value);
        const sortedLabels = data.map(item => item.label);
        const sortedValues = data.map(item => item.value);

        const colourMap = {
            "Lilydale": "#00518b",
            "Belgrave": "#00518b",
            "Alamein": "#00518b",
            "Glen Waverley": "#00518b",
            "Pakenham": "#00a8e4",
            "Cranbourne": "#00a8e4",
            "Frankston": "#009646",
            "Stony Point": "#009646",
            "Sandringham": "#f07fb3",
            "Werribee": "#009646",
            "Williamstown": "#009646",
            "Sunbury": "#00a8e4",
            "Upfield": "#fcb919",
            "Craigieburn": "#fcb919",
            "Hurstbridge": "#d0222f",
            "Mernda": "#d0222f",
            'Flemington Racecourse': '#929598',
            'Albury': '#7d4099',
            'Bairnsdale': '#7d4099',
            'Traralgon': '#7d4099',
            'Warrnambool': '#7d4099',
            'Geelong': '#7d4099',
            "Ararat": '#7d4099',
            "Ballarat": '#7d4099',
            'Maryborough': '#7d4099',
            'Swan Hill': '#7d4099',
            'Bendigo': '#7d4099',
            'Echuca': '#7d4099',
            'Seymour': '#7d4099',
            'Shepparton': '#7d4099',

            'Metro Trains Melbourne': '#0073cf',
            'V/Line': '#753f98',
            'Mckenzies Tourist Service': '#f7eaca',
            'Kinetic': '#54c0e8',
            'Ventura': '#003e5f',

            'Sydney Trains': '#ed6601',
            'NSW TrainLink': '#ed6601',
            'Sydney Metro': '#0e8489',
        };

        const backgroundColors = sortedLabels.map((lbl, i) => {
            return colourMap[lbl] || '#6b6b6b';
        });

        const borderColors = backgroundColors.map(c => c);

        const ctx = document.getElementById('freqChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: sortedLabels,
                datasets: [{
                    label: 'Count',
                    data: sortedValues,
                    backgroundColor: backgroundColors,
                    borderColor: borderColors,
                    borderWidth: 1,
                    borderRadius: 6,
                    maxBarThickness: 48
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#2e2e2e',
                        titleColor: '#ffffff',
                        bodyColor: '#ffffff',
                        borderColor: 'rgba(255,255,255,0.08)',
                        borderWidth: 1,
                        callbacks: {
                            label: ctx => `${ctx.label}: ${ctx.raw}`
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: '#cfcfcf' },
                        grid: { color: 'transparent' }
                    },
                    y: {
                        beginAtZero: true,
                        ticks: { color: '#cfcfcf', stepSize: 1 },
                        grid: { color: 'rgba(255,255,255,0.04)' }
                    }
                }
            }
        });
    </script>
    </div>
</body>
</html>
