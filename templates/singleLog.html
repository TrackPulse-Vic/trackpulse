<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{{ log[0][8] }} to {{ log[0][9] }} - TrackPulse</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/viewer.css') }}">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="utf-8">
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='icons/logos/favicon.ico') }}">
    </head>

    <body>
        {% include 'navbar.html' %}
        {% for thing in log %}
            <div class="log-single" style="--accent-color: {{ lineColors.get(thing[2], {}).get(thing[7], '#929598') }};">
                <!-- <img class="train-image" data-vehicle="{{ thing[5] }}" src="" alt="loading photo..."> -->
                <p>{{ thing[8] }} to {{ thing[9] }} | {{ thing[3] }}</p>
                <p>Line: {{ thing[7] }}</p>
                <p>Vehicle: {{ thing[6] }}</p>
                <p>Number: {{ thing[5] }}</p>
                <p class="note">{{ thing[10] }}</p>
                <button class="edit-log">Edit</button>
                <button class="edit-log" onclick="fetch('/api/deleteLog', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: '{{ thing[0] }}'}) }).then(r => r.ok ? window.location.href = '/view?message=Log {{thing[0]}} deleted successfully&table=true' : alert('Error'))">Delete</button>
                </div>
        {% endfor %}
    <script>
        async function fetchAndSetImage(imgElement) {
            const vehicle = imgElement.getAttribute('data-vehicle');
            if (!vehicle) return;

            try {
                const response = await fetch(`http://victorianrailphotos.com/api/photos/${vehicle}?set=true`);
                const data = await response.json();

                for (const carriage of (data.carriages || [])) {
                    if (carriage.photos && carriage.photos.length > 0) {
                        const firstImage = carriage.photos[0];
                        imgElement.src = firstImage.url;
                        imgElement.alt = `carriage ${carriage.carriage}`;
                        return;
                    }
                }

                imgElement.style = "display: none;";
            } catch (error) {
                console.error(`Error fetching images for vehicle ${vehicle}:`, error);
                imgElement.style = "display: none;";
            }
        }

        function initLazyLoad() {
            const imageElements = document.querySelectorAll('.train-image');

            if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver((entries, obs) => {
                    for (const entry of entries) {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            fetchAndSetImage(img);
                            obs.unobserve(img);
                        }
                    }
                }, {
                    root: null,
                    rootMargin: '200px',
                    threshold: 0.01
                });

                imageElements.forEach(img => observer.observe(img));
            }
        }

        document.addEventListener('DOMContentLoaded', initLazyLoad);
        </script>
    </body>
</html>
