<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Train Map</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/map.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet GPX plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .leaflet-marker-icon {
            transition: transform 0.9s linear;
        }
        .vehicle-icon {
            position: relative;
            width: 28px;
            height: 28px;
            display: inline-block;
            transform: translate3d(0,0,0);
        }
        .vehicle-icon svg.heading-arrow {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            transform-origin: center center;
            transition: transform 0.9s linear;
            opacity: 0.98;
            pointer-events: none;
            filter: drop-shadow(0 0 1px rgba(0,0,0,0.6));
        }
    </style>
    
</head>
<body>
    {% include 'navbar.html' %}
    <div id="map" class="map"></div>
    <script>
        var map = L.map('map').setView([-37.8136, 144.9631], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        var markerLayer = L.layerGroup().addTo(map);
    var gpxLayer = L.layerGroup().addTo(map);

        // Keep markers between updates to allow smooth transitions
        const trackedMarkers = {};
        let anonCounter = 0;

        function updateMap() {
            fetch('/api/locations/{{ mode }}')
            .then(response => response.json())
            .then(data => {
                const seenIds = new Set();

                const modeColorMap = {
                    vline: '#831586',
                    metro: '#0876d0',
                    tram: '#009646', 
                    bus: '#f68e2b', 
                };

                function createIconForMode(mode) {
                    const key = (mode || '').toLowerCase();
                    const color = modeColorMap[key] || modeColorMap.default;
                    // Use a divIcon that contains only an SVG arrow. The arrow's fill/stroke uses the mode colour.
                    const html = `
                        <div class="vehicle-icon">
                            <svg class="heading-arrow" viewBox="0 0 24 24" aria-hidden="true">
                                <!-- arrow pointing up (north) by default) - uses currentColor for easy styling -->
                                <path d="M12 2 L19 21 L12 17 L5 21 Z" fill="${color}" stroke="#222" stroke-width="0.5" />
                            </svg>
                        </div>
                    `;
                    return L.divIcon({
                        html: html,
                        className: '', // avoid extra classes from Leaflet
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    });
                }

                function applyHeadingToMarker(marker, heading) {
                    try {
                        if (!marker || !marker._icon) return;
                        const arrow = marker._icon.querySelector && marker._icon.querySelector('.heading-arrow');
                        if (!arrow) return;
                        if (heading === null || heading === undefined || isNaN(Number(heading))) {
                            arrow.style.display = 'none';
                        } else {
                            arrow.style.display = '';
                            // GTFS heading/bearing is degrees clockwise from north
                            const deg = Number(heading) || 0;
                            arrow.style.transform = 'rotate(' + deg + 'deg)';
                        }
                    } catch (e) {
                        // ignore DOM errors
                    }
                }

                function genMarkers(msg, modeForIcons) {
                    const messages = Array.isArray(msg) ? msg : [msg];
                    messages.forEach(function(m) {
                        const entities = Array.isArray(m.entity) ? m.entity : (m.entity ? [m.entity] : []);
                        entities.forEach(function(entity) {
                            const vehicleWrapper = entity.vehicle || {};
                            const pos = vehicleWrapper.position || entity.position;
                            const trip = vehicleWrapper.trip || {};
                            const vehicle = vehicleWrapper.vehicle || {};

                            if (!pos || typeof pos.latitude !== 'number' || typeof pos.longitude !== 'number') {
                                return; // skip invalid
                            }

                            // compute heading/bearing from possible fields in the GTFS payload
                            const headingVal = (pos && (pos.bearing ?? pos.heading ?? pos.course ?? pos.bearingDegrees)) ||
                                               (vehicle && (vehicle.bearing ?? vehicle.heading ?? vehicle.course)) || null;

                            const icon = createIconForMode(modeForIcons || (m.header && m.header.mode) || (trip && trip.routeId));

                            const routeId = trip.routeId || '';
                            const routeMatch = routeId.match(/vic-\d{2}-([A-Z]{3})(?=:)/);
                            const lineName = routeMatch ? routeMatch[1] : (routeId || 'Unknown');

                            const popupHtml = [
                                'Fleet Number: ' + (vehicle.id ?? 'Unknown'),
                                'Line: ' + lineName,
                                '<div style="max-width:200px; max-height:150px; overflow:hidden;"><img src="/api/photo/{{ mode }}?number=' + (vehicle.id ?? '') + '" alt="Train Photo" style="width:100%; height:auto;"></div>',
                            ].join('<br>');

                            // get an id for the train marker
                            let idKey = vehicle.id ?? (trip.tripId || trip.routeId) ?? null;
                            if (!idKey) {
                                anonCounter += 1;
                                idKey = 'anon_' + anonCounter;
                            }

                            seenIds.add(idKey);

                            const latlng = [pos.latitude, pos.longitude];

                            if (trackedMarkers[idKey]) {
                                // Update existing marker position (will animate due to CSS transition), icon, and popup
                                const marker = trackedMarkers[idKey];
                                marker.setLatLng(latlng);
                                if (marker.getPopup()) marker.setPopupContent(popupHtml);
                                else marker.bindPopup(popupHtml);
                                // update icon if changed
                                marker.setIcon(icon);
                                // Leaflet may recreate the icon DOM when setIcon is called.
                                // Reapply heading after a short delay to ensure the DOM exists.
                                applyHeadingToMarker(marker, headingVal);
                                setTimeout(() => applyHeadingToMarker(marker, headingVal), 50);
                            } else {
                                // Create new marker
                                const marker = L.marker(latlng, { icon: icon }).addTo(markerLayer).bindPopup(popupHtml);
                                // set initial heading on creation and reapply shortly after DOM attach
                                applyHeadingToMarker(marker, headingVal);
                                setTimeout(() => applyHeadingToMarker(marker, headingVal), 50);
                                trackedMarkers[idKey] = marker;
                            }
                        });
                    });
                }

                if (Array.isArray(data)) {
                    genMarkers(data, null);
                } else if (data && typeof data === 'object' && !Array.isArray(data)) {
                    // If object looks like a mapping of mode->message (each value has an 'entity'), iterate entries.
                    const entries = Object.entries(data);
                    const isModeMap = entries.length > 0 && entries.every(([k, v]) => v && (v.entity || Array.isArray(v.entity)) );

                    if (isModeMap) {
                        entries.forEach(([modeKey, msg]) => {
                            genMarkers(msg, modeKey);
                        });
                    } else {
                        // treat as a single feed message
                        genMarkers(data, null);
                    }
                }
                // remove shit markers that arent there anymroe
                for (const key in trackedMarkers) {
                    if (!seenIds.has(key)) {
                        try {
                            markerLayer.removeLayer(trackedMarkers[key]);
                        } catch (e) {
                        }
                        delete trackedMarkers[key];
                    }
                }

                console.log('Map updated at ' + new Date().toLocaleTimeString());
            })
            .catch(error => console.error('Error updating map:', error));
        }

        updateMap();

        setInterval(updateMap, 15000);

        // load gpx files
        const gpxColorPalette = [
            '#00518b', '#00518b', '#00518b', '#00518b', '#00a8e4', '#00a8e4', '#009646', '#009646', '#f07fb3', '#009646', '#009646', '#009646', '#831586',
        ];

        const gpxFiles = [
            'LIL.gpx',
            'BEL.gpx',
            'ALM.gpx',
            "GWY.gpx",
            'PKM.gpx',
            'CBN.gpx',
            'STY.gpx',
            'FKN.gpx',
            'SHM.gpx',
            'WIL.gpx',
            'WER.gpx',
            'ALT.gpx',
            "SWH.gpx"

        ];

        function loadGpxFiles() {
            gpxLayer.clearLayers();


            gpxFiles.forEach((fname, idx) => {
                const url = '/static/gpx/' + encodeURIComponent(fname);
                const color = gpxColorPalette[idx % gpxColorPalette.length];
                try {
                    const gpx = new L.GPX(url, {
                        async: true,
                        polyline_options: {
                            color: color,
                            weight: 4,
                            opacity: 0.8
                        },
                        marker_options: {
                            startIconUrl: null,
                            endIconUrl: null,
                            shadowUrl: null
                        }
                    }).on('loaded', function(e) {
                        // Optionally fit bounds to include tracks
                        try {
                            map.fitBounds(e.target.getBounds());
                        } catch (err) {
                            // ignore if bounds invalid
                        }
                    }).addTo(gpxLayer);

                } catch (err) {
                    console.error('Error loading GPX', fname, err);
                }
            });
        }

        // initial load of manually-listed GPX files
        loadGpxFiles();
    </script>
</body>
</html>
